<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Books List</h1>

    <input
        type="text"
        id="search"
        placeholder="Search by Title..."
        onkeyup="searchBook()"
    >

    <br><br>

    <table border="1" width="100%">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Category</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="bookTable">
        </tbody>
    </table>

    <script src="script.js"></script>

</body>
</html>
